{% extends 'base.html' %}

{% block content %}
<div class="glass-panel fade-in-up" style="max-width: 600px; margin: 50px auto;">
    <h2 class="text-center">Contact Us</h2>
    <p class="text-center">Have a question or feedback? Reach out to us!</p>
    
    <form action="#" method="POST" class="mt-4">
        <div class="form-group">
            <label>Name</label>
            <input type="text" class="form-control" required>
        </div>
        <div class="form-group">
            <label>Email</label>
            <input type="email" class="form-control" required>
        </div>
        <div class="form-group">
            <label>Message</label>
            <textarea class="form-control" rows="5" required></textarea>
        </div>
        <button type="button" class="btn-primary full-width" onclick="alert('Message sent successfully!')">Send Message</button>
    </form>
</div>
{% endblock %}
