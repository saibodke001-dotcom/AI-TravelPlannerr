{% extends 'base.html' %}

{% block content %}
<div class="explorer-header text-center fade-in-up">
    <h2>Trending Destinations</h2>
    <p>Discover top-rated places around the world to inspire your next trip.</p>
</div>

<div class="destination-grid">
    {% for dest in destinations %}
    <div class="destination-card glass-panel hover-lift fade-in-up" style="animation-delay: {{ loop.index * 0.1 }}s">
        <!-- Placeholder for image, can be stylized with CSS gradients if image missing -->
        <div class="destination-img-placeholder">
            <span>🌍</span>
        </div>
        <div class="destination-info">
            <h3>{{ dest.name }}</h3>
            <p>{{ dest.desc }}</p>
            <a href="{{ url_for('planner') }}" class="btn-outline full-width">Plan a trip here</a>
        </div>
    </div>
    {% endfor %}
</div>
{% endblock %}
